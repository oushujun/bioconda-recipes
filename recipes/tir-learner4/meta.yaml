{% set name = "TIR-Learner" %}
{% set version = "4.0.1" %}
{% set sha256 = "f36828693f1c3bbf4f7c2441b7ba8d64d8a42653d0cb3738e52b0c365444e2e8" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://github.com/KGerhardt/TIR-Learner/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: generic
  run_exports:
    - {{ pin_subpackage('tir-learner', max_pin='x') }}
  skip: True  # [osx]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python <3.13
    - numpy
    - cython
    - pip
    - setuptools
    - wheel
  run:
    - python <3.13
    - numpy
    - pyfastx
    - pywfa
    - keras
    - pytorch
    - genometools-genometools
    - genericrepeatfinder
    - blast
    - pigz

test:
  commands:
    - TIR-Learner --version
    - TIR-Learner --help
    
about:
  summary: "Accelerated TIR-Learner for identifying TIR transposable elements"
  home: https://github.com/KGerhardt/TIR-Learner
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE
  dev_url: https://github.com/KGerhardt/TIR-Learner
  doc_url: https://github.com/KGerhardt/TIR-Learner/blob/main/README.md

extra:
  recipe-maintainers:
    - KGerhardt
